[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmthon"
version = "0.1.0"
description = "Versioned contracts and offline comparison for an LLM execution predictor benchmark"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
llmthon = "llmthon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llmthon = ["schemas/v1/*.json"]
